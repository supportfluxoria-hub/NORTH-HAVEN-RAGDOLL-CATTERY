<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Document | North Haven Ragdoll Cattery</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <style>
    html, body { margin: 0; height: 100%; background: #f3ebe0; font-family: Montserrat, sans-serif; }
    .viewer-msg {
      max-width: 420px;
      margin: 4rem auto;
      text-align: center;
      color: #002147;
      padding: 1rem;
    }
    iframe, embed {
      width: 100%;
      height: 100vh;
      border: 0;
      display: block;
      background: #fff;
    }
  </style>
</head>
<body>
  <p class="viewer-msg" id="status">Opening document…</p>
  <script src="js/store.js?v=18"></script>
  <script>
    (function () {
      var S = window.NHStore;
      var params = new URLSearchParams(window.location.search);
      var id = params.get("doc") || "";
      var status = document.getElementById("status");
      var meta = S && S.getDocumentMeta ? S.getDocumentMeta(id) : null;

      if (!S || !meta) {
        status.textContent = "Document not found.";
        return;
      }

      document.title = meta.title + " | North Haven Ragdoll Cattery";
      var custom = S.getDocument(id);
      var url = custom && custom.dataUrl ? custom.dataUrl : meta.defaultUrl;
      var mime = (custom && custom.mime) || "";
      var name = ((custom && custom.fileName) || "").toLowerCase();
      var isHtml =
        mime.indexOf("html") !== -1 ||
        /\.html?$/.test(name) ||
        (!custom && /\.html?$/.test(meta.defaultUrl));

      if (!custom) {
        window.location.replace(meta.defaultUrl);
        return;
      }

      status.remove();

      if (isHtml && url.indexOf("data:text/html") === 0) {
        var frame = document.createElement("iframe");
        frame.title = meta.title;
        frame.src = url;
        document.body.appendChild(frame);
        return;
      }

      if (mime.indexOf("pdf") !== -1 || /\.pdf$/.test(name) || url.indexOf("data:application/pdf") === 0) {
        var embed = document.createElement("embed");
        embed.type = "application/pdf";
        embed.src = url;
        document.body.appendChild(embed);
        return;
      }

      // DOC/DOCX and other types: trigger download / open
      var link = document.createElement("a");
      link.href = url;
      link.download = custom.fileName || meta.title;
      link.rel = "noopener";
      document.body.appendChild(link);
      link.click();
      status = document.createElement("p");
      status.className = "viewer-msg";
      status.innerHTML =
        "If the file did not open automatically, <a href=\"" +
        url +
        "\" download=\"" +
        (custom.fileName || "document") +
        "\">download it here</a>.";
      document.body.appendChild(status);
    })();
  </script>
</body>
</html>
